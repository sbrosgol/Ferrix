[workspace]
resolver = "3"
members = ["crates/*", "xtask"]
default-members = ["crates/*"]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.92"
license = "MIT OR Apache-2.0"
repository = "https://github.com/sbrosgol/Ferrix"
publish = false

[workspace.dependencies]
ferrix-types = { path = "crates/ferrix-types" }
ferrix-annot = { path = "crates/ferrix-annot" }
ferrix-compose = { path = "crates/ferrix-compose" }
ferrix-convert = { path = "crates/ferrix-convert" }
ferrix-core = { path = "crates/ferrix-core" }
ferrix-engine = { path = "crates/ferrix-engine" }
ferrix-engine-pdfium = { path = "crates/ferrix-engine-pdfium" }
ferrix-io = { path = "crates/ferrix-io" }
ferrix-pdf = { path = "crates/ferrix-pdf" }
ferrix-print = { path = "crates/ferrix-print" }
ferrix-store = { path = "crates/ferrix-store" }
ferrix-text = { path = "crates/ferrix-text" }
unicode-normalization = "0.1.26"

arboard = { version = "3.7.0", default-features = false, features = ["wayland-data-control"] }
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive", "env"] }
cosmic-text = { version = "0.15.0", default-features = false, features = ["std", "swash"] }
unicode-segmentation = "1.13.3"
flate2 = "1.1.11"
iced = { version = "0.14.0", features = ["advanced", "canvas", "image", "svg", "tokio"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
krilla = { version = "0.8.2", default-features = false, features = ["raster-images"] }
lopdf = { version = "=0.46.0", default-features = false }
pdfium-render = { version = "0.9.5", default-features = false, features = ["pdfium_8125", "thread_safe"] }
rfd = "0.18.0"
rusqlite = { version = "0.43.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive", "rc"] }
serde_json = "1"
sha2 = "0.11.1"
resvg = { version = "0.45.1", default-features = false }
tar = "0.4.46"
thiserror = "2.0.21"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
ureq = { version = "3.5.2", features = ["platform-verifier"] }

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
