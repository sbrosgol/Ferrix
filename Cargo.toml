[workspace]
resolver = "3"
members = ["crates/*", "xtask"]
default-members = ["crates/*"]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
ferrix-types = { path = "crates/ferrix-types" }
ferrix-engine = { path = "crates/ferrix-engine" }
ferrix-engine-pdfium = { path = "crates/ferrix-engine-pdfium" }

anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive", "env"] }
flate2 = "1.1.11"
iced = { version = "0.14.0", features = ["image", "tokio"] }
image = { version = "0.25.10", default-features = false, features = ["png"] }
pdfium-render = { version = "0.9.5", default-features = false, features = ["pdfium_8125", "thread_safe"] }
rfd = "0.18.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.1"
tar = "0.4.46"
thiserror = "2.0.21"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
ureq = { version = "3.5.2", features = ["platform-verifier"] }

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
