# cargo-deny: license, advisory and dependency policy. See docs/architecture.md §9.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
# Vulnerabilities always fail. "Unmaintained" notices fail only for crates we depend on
# directly; transitive ones (inside iced, rfd, zbus…) are tracked upstream.
unmaintained = "workspace"

[licenses]
version = 2
# Permissive licenses only: Ferrix is MIT OR Apache-2.0 and must stay redistributable as such.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    "NCSA",
    "Zlib",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
