<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Ferrix app icon. Drawn on Apple's 1024 grid: an 824 px tile with a 100 px margin.
       `cargo xtask bundle` renders it into the macOS .icns. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5E89F8"/>
      <stop offset="1" stop-color="#2747C9"/>
    </linearGradient>
    <linearGradient id="fold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E4EAFD"/>
      <stop offset="1" stop-color="#B7C7F8"/>
    </linearGradient>
    <filter id="tile-shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity="0.28"/>
    </filter>
    <filter id="page-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#0B1F6B" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#tile)" filter="url(#tile-shadow)"/>
  <!-- A soft highlight along the top edge of the tile. -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="none"
        stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="4"/>

  <!-- The page, with its top-right corner folded. -->
  <g filter="url(#page-shadow)">
    <path d="M318 214 H600 L726 340 V786 Q726 810 702 810 H318 Q294 810 294 786 V238 Q294 214 318 214 Z"
          fill="#FFFFFF"/>
  </g>
  <path d="M600 214 V316 Q600 340 624 340 H726 Z" fill="url(#fold)"/>

  <!-- A heading and lines of text. -->
  <rect x="362" y="296" width="190" height="40" rx="20" fill="#3D6AF2"/>
  <rect x="362" y="412" width="296" height="24" rx="12" fill="#CBD5F2"/>
  <rect x="362" y="468" width="296" height="24" rx="12" fill="#CBD5F2"/>
  <rect x="362" y="524" width="250" height="24" rx="12" fill="#CBD5F2"/>
  <rect x="362" y="610" width="296" height="24" rx="12" fill="#CBD5F2"/>
  <rect x="362" y="666" width="196" height="24" rx="12" fill="#CBD5F2"/>
</svg>
