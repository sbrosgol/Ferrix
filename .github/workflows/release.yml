name: Release

# Pushing a tag `v<version>` (matching the workspace version) builds every platform and
# creates a *draft* GitHub release with the packages, SHA256SUMS and build provenance.
# Review the draft and publish it by hand. Running the workflow manually only builds the
# packages (downloadable from the run's artifacts).
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - id: version
        run: |
          version=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "ferrix-app") | .version')
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::tag $GITHUB_REF_NAME does not match the workspace version $version"
            exit 1
          fi
          echo "version=$version" >>"$GITHUB_OUTPUT"

  package:
    name: package (${{ matrix.name }})
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macos-universal, os: macos-latest }
          - { name: windows-x64, os: windows-latest }
          - { name: windows-arm64, os: windows-11-arm }
          # The oldest supported Ubuntu keeps the glibc requirement low (2.35).
          - { name: linux-x64, os: ubuntu-22.04 }
          - { name: linux-arm64, os: ubuntu-22.04-arm }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      # No build cache: release binaries are built from a clean slate.
      - name: Package
        shell: bash
        run: dist/package.sh "${{ needs.version.outputs.version }}"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}
          path: out/Ferrix-*
          if-no-files-found: error

  publish:
    if: github.ref_type == 'tag'
    needs: [version, package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: out
          merge-multiple: true
      - name: Checksums
        working-directory: out
        run: sha256sum Ferrix-* | tee SHA256SUMS
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: out/Ferrix-*
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          flags=(--draft --verify-tag --generate-notes --title "Ferrix $VERSION")
          [[ "$VERSION" == *-* ]] && flags+=(--prerelease)
          gh release create "$GITHUB_REF_NAME" "${flags[@]}" out/*
